<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HACTP0EHUE | OFFICIAL BIO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Montserrat:wght@300;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #cc0000;
            --accent-glow: #ff3333;
            --bg-dark: #0a0a0a;
            --glass: rgba(10, 10, 10, 0.85);
        }

        body, html {
            margin: 0;
            padding: 0;
            background: var(--bg-dark);
            color: white;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            height: 100%;
        }

        #preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease-in-out;
        }

        .loader-text {
            font-family: 'Syncopate', sans-serif;
            font-size: 1.2rem;
            color: var(--accent);
            text-transform: none;
            letter-spacing: 2px;
            animation: pulse 1.5s infinite alternate, glow 2s infinite;
            text-align: center;
            padding: 0 20px;
        }

        @keyframes pulse {
            from { opacity: 0.2; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1.1); }
        }

        @keyframes glow {
            0%, 100% { text-shadow: 0 0 10px var(--accent); }
            50% { text-shadow: 0 0 30px var(--accent), 0 0 50px var(--accent); }
        }

        .loader-bar {
            width: 200px;
            height: 2px;
            background: rgba(255,255,255,0.1);
            margin-top: 20px;
            position: relative;
            overflow: hidden;
        }

        .loader-bar::after {
            content: '';
            position: absolute;
            width: 0;
            height: 100%;
            background: var(--accent);
            animation: load 1.5s forwards;
        }

        @keyframes load {
            0% { width: 0; }
            100% { width: 100%; }
        }

        #main-content {
            opacity: 0;
            transition: opacity 1s ease;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #111 0%, #000 100%);
        }

        .bio-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(204, 0, 0, 0.4);
            border-radius: 25px;
            padding: 40px;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 20px rgba(204,0,0,0.3);
            text-align: center;
        }

        .avatar-box {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
        }

        .avatar-box i {
            font-size: 80px;
            color: var(--accent);
            filter: drop-shadow(0 0 15px var(--accent));
        }

        .info-grid {
            text-align: left;
            margin-top: 20px;
        }

        .info-row {
            display: flex;
            align-items: center;
            padding: 12px;
            margin: 8px 0;
            background: rgba(255,255,255,0.03);
            border-radius: 10px;
            transition: 0.4s;
            border-left: 3px solid transparent;
        }

        .info-row:hover {
            background: rgba(204, 0, 0, 0.15);
            border-left: 3px solid var(--accent);
            transform: translateX(10px);
        }

        .info-row i {
            margin-right: 15px;
            color: var(--accent);
            width: 25px;
            text-align: center;
        }

        .label {
            font-weight: bold;
            color: #888;
            font-size: 0.8rem;
            text-transform: uppercase;
            margin-right: 10px;
        }

        .value {
            font-family: 'Syncopate', sans-serif;
            font-size: 0.85rem;
            color: #fff;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
            padding: 10px;
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            font-size: 0.9rem;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stat-item i { color: var(--accent); }
        .like-active { color: #ff4757 !important; animation: pulse 0.5s ease; }

        .btn-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-top: 25px;
        }

        .btn {
            padding: 15px;
            border-radius: 12px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 1px solid var(--accent);
            transition: 0.4s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            background: var(--accent);
            color: black;
            box-shadow: 0 0 25px var(--accent);
        }

        .click-effect {
            position: absolute;
            width: 10px;
            height: 10px;
            background: var(--accent);
            border-radius: 50%;
            pointer-events: none;
            animation: clickAnim 0.6s ease-out forwards;
        }

        @keyframes clickAnim {
            to { transform: scale(5); opacity: 0; }
        }
    </style>
</head>
<body onclick="spawnEffect(event)">

    <div id="preloader">
        <div class="loader-text">ненавижу человечество</div>
        <div style="font-size: 0.8rem; margin-top: 10px; color: #555;">CHECK / CHEATS / VISUALS</div>
        <div class="loader-bar"></div>
    </div>

    <div id="main-content">
        <div class="bio-card">
            <div class="avatar-box">
                <i class="fas fa-skull"></i>
            </div>

            <div class="info-grid">
                <div class="info-row"><i class="fas fa-signature"></i> <span class="label">Name:</span> <span class="value">ненавижу человечество</span></div>
                <div class="info-row"><i class="fab fa-telegram"></i> <span class="label">TG:</span> <span class="value">@IZUMRUDIKYT</span></div>
                <div class="info-row"><i class="fas fa-map-marker-alt"></i> <span class="label">Country:</span> <span class="value">Russia 🇷🇺</span></div>
                <div class="info-row"><i class="fas fa-exchange-alt"></i> <span class="label">Field:</span> <span class="value">Check crack cheats and visuals</span></div>
                <div class="info-row"><i class="fas fa-code"></i> <span class="label">Hobby:</span> <span class="value">Check cheats and visuals</span></div>
            </div>

            <div class="stats-bar">
                <div class="stat-item">
                    <i class="fas fa-eye"></i>
                    <span id="view-count">...</span>
                </div>
                <div class="stat-item" id="like-trigger" style="cursor: pointer;" onclick="handleLike()">
                    <i class="fas fa-heart" id="like-icon"></i>
                    <span id="like-count">...</span>
                </div>
            </div>

            <div class="btn-container">
                <a href="https://t.me/IZUMRUDIKYT" class="btn"><i class="fab fa-telegram"></i> TELEGRAM</a>
            </div>
        </div>
    </div>

    <script>
        const userKey = "hactr0ehue_bio_stats";

        async function updateStats() {
            try {
                const vRes = await fetch(`https://api.countapi.xyz/hit/${userKey}/views`);
                const vData = await vRes.json();
                document.getElementById('view-count').innerText = vData.value;

                const lRes = await fetch(`https://api.countapi.xyz/get/${userKey}/likes`);
                const lData = await lRes.json();
                document.getElementById('like-count').innerText = lData.value || 0;
            } catch (e) {
                document.getElementById('view-count').innerText = "42";
                document.getElementById('like-count').innerText = "7";
            }
        }

        async function handleLike() {
            if (localStorage.getItem('liked_hactr0ehue')) return;

            try {
                const res = await fetch(`https://api.countapi.xyz/hit/${userKey}/likes`);
                const data = await res.json();
                document.getElementById('like-count').innerText = data.value;
                document.getElementById('like-icon').classList.add('like-active');
                localStorage.setItem('liked_hactr0ehue', 'true');
            } catch (e) {}
        }

        window.addEventListener('load', () => {
            updateStats();
            if (localStorage.getItem('liked_hactr0ehue')) {
                document.getElementById('like-icon').classList.add('like-active');
            }

            setTimeout(() => {
                const loader = document.getElementById('preloader');
                const main = document.getElementById('main-content');
                loader.style.opacity = '0';
                setTimeout(() => {
                    loader.style.display = 'none';
                    main.style.opacity = '1';
                }, 800);
            }, 1500);
        });

        function spawnEffect(e) {
            const effect = document.createElement('div');
            effect.className = 'click-effect';
            effect.style.left = e.pageX - 5 + 'px';
            effect.style.top = e.pageY - 5 + 'px';
            document.body.appendChild(effect);
            setTimeout(() => effect.remove(), 600);
        }
    </script>
</body>
</html>
